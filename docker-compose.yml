services:
  elasticsearch:
    platform: linux/x86_64
    image: opensearchproject/opensearch:2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Password321@Secure # Temporary for testing locally - this will change longer term
      - plugins.security.disabled=true # Temporary for testing locally - this will change longer term.
    ports:
      - "9200:9200"

  testrunner:
    image: sage/elasticsearch_test_runner
    container_name: test_runner
    command: sh -c "while true; do echo 'Container is running..'; sleep 5; done"
    environment:
      - ELASTIC_SEARCH_HOST=http://elasticsearch
    depends_on:
      - elasticsearch
    volumes:
      - ./:/elastic_search_framework
